[package]
name = "cubarium-aa-study"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "aa_comparison"

[workspace]

[[bin]]
name = "aa_comparison"
path = "aa_comparison.rs"

[[bin]]
name = "sail_comparison"
path = "sail_comparison.rs"

[[bin]]
name = "sail_meal_comparison"
path = "sail_meal_comparison.rs"
required-features = ["meals"]

[features]
meals = ["dep:cubarium", "dep:cubarium-core"]

[dependencies]
cubarium = { path = "../../../crates/cubarium", optional = true }
cubarium-core = { path = "../../../crates/cubarium-core", optional = true }
cubarium-render = { path = "../../../crates/cubarium-render" }
cubarium-surface = { path = "../../../crates/cubarium-surface" }
cube-proto = { path = "../../../vendor/cube-proto" }
png = "0.18"
serde_json = "1"
