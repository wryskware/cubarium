[package]
name = "cubarium-rules"
version.workspace = true
edition.workspace = true
# AtomicU64::from_mut_slice (the water host's safe shared views) is stable from 1.98.
rust-version = "1.98"
publish = false
description = "Simulation rules written once as plain, allocation-free functions over plain data (the water exchange and column phases), with serial and rayon host drivers. no_std-compatible so a GPU driver can compile the same source."

[features]
default = []
# The multi-threaded host drivers of the water phases (rayon over columns).
par = ["dep:rayon"]

[dependencies]
rayon = { version = "1", optional = true }
bytemuck = "1"

[lints]
workspace = true
