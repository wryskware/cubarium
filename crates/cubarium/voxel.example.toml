# `cubarium voxel --config crates/cubarium/voxel.example.toml`
#
# Every value here is the default, so this file is also the documentation: delete a line
# and nothing changes. Unknown keys are errors, so a typo is reported rather than ignored.
# One value is deliberately *not* written down — `[world] depth` — because it belongs to
# `cubarium_voxel::Config::default()`; see the note below it.

# Elevation of the orthographic view: the camera chosen by the storyboard study
# (`art/studies/voxel-storyboard/`). It reaches the picture only as a whole number of
# pixels of lift per voxel of depth, `round(px_per_voxel * tan(tilt))` — 2 px at these
# defaults — because a fractional depth step would smear every block edge.
tilt_degrees = 30.0

# Pixels per voxel edge, the other half of the chosen camera. A front face is this square;
# a top face is this wide and `depth step` tall. Below 4 the sprite atlas stops reading.
# The raster width is always `world.width * px_per_voxel`, so the strip fills it exactly
# and the seam in x is a plain wrap.
px_per_voxel = 4

# Ring raster height in pixels. 0 derives it from the world so the whole strip fits
# (`world.height * px_per_voxel + world.depth * depth step`); anything smaller crops
# from the top and says so once. The floor line stays on the bottom row either way.
raster_height = 0

# How far the back wall fades toward the haze colour. 0 turns the depth tint off.
haze = 0.55

# Opacity of one voxel of free water. The surface row blends harder than the body, and a
# pool many slabs deep still blends one water face per pixel.
water_alpha = 0.5

# Restrained terrain grain and a dark indigo sky. These affect presentation only.
dither = 0.04
sky_gradient = true

# How plants and animals are drawn: "models", the voxel models Blender bakes from the
# simulation's own numbers (`scripts/blender/bake_voxel_models.py`), or "glyphs", the
# dev-mode glyphs any species without a model falls back to. `models_dir` holds one
# directory per voxel size (`125/`, `250/`); a relative path is from the working
# directory, and missing models are said once on stderr and drawn as glyphs.
organisms = "models"
models_dir = "assets/voxel-models"

# The GPU renderer's lighting tier. "flat" is the flat tier's stand-ins for light (the
# column roof shade, the top faces' gain and tint toward the light colour), which the
# panel and the cube keep. "lit" shades each face texel by the ambient light instead: the
# core's own sky visibility at the face's open cell, voxel ambient occlusion and the plant
# layer's canopy, snapped to a short ladder. `config/desktop/*.toml` ask for "lit". The
# CPU presenter ignores it.
lighting = "flat"

# The lit tier's numbers; the flat tier ignores them.
[light]
levels = 0          # 0: smooth light; 2 or more: rungs on an ambient ladder, floor to full
ambient_gain = 1.4  # what full ambient light multiplies a base colour by
ambient_floor = 0.2 # the lowest rung, as a fraction of full
ao = 0.5            # how far a face corner with both sides occluded darkens
ambient_tint = 0.15 # how far the ambient leans toward the sky's hue
# The sun: the direction toward it (x right, y up, z into the scene; z < 0 keeps it in
# front, so the faces the picture shows are lit and shadows fall back into the scene).
# A texel it reaches is brighter than one in shadow by a third of full light (one rung on
# a 4-rung ladder), with hard texel edges; crowns dapple it.
sun = [-1.0, 2.0, -1.0]
sun_tint = 0.18     # how far a sunlit texel leans toward the palette's light, times N·L
# The emitters' halo (lit tier): its strength (smooth: 20 times this of their blurred
# colour; blocky: this of their colour at full step), how far it reaches in voxel cells
# (smooth: twice the blur's sigma; blocky: rounded), and "smooth" or "blocky".
bloom = 0.3
bloom_radius = 1.5
bloom_style = "smooth"
# The water (lit tier): absorption a voxel of path in units of the deep water colour,
# the reflection gain over Fresnel, the ripple tilt, the animation rate and the reflection
# march.
water_absorb = 0.1
water_reflect = 6.0
water_ripple = 0.2
water_hz = 12.0
water_smooth = false  # true: the water moves every frame (same speed) instead of in steps
water_reflect_cells = 64

[world]
# `cubarium_voxel::Config`. x wraps; y is up from the foundation; z runs into the habitat.
width = 128
height = 72
# `depth` is on purpose absent: how deep the habitat is is the core's decision, so it
# mirrors `cubarium_voxel::Config::default().depth` — 24 slabs at the chosen camera, which
# is 48 px of ground plane on top of the strip's own height. Write `depth = N` to override.
# 72 voxels leave vertical room for local shelves and fit the panel's raster:
# 4 px per voxel times 72, plus 2 px of depth step times 24, is 336 of its 360 rows.
# The cell size the `default` landscape below was written for. A recipe fixes its feature
# sizes in metres, so halving this resolves the same landforms finer rather than shrinking
# them; the shipped `small` ring runs at 0.125 m and states it.
voxel_m = 0.25
seed = 1
water_substeps = 4

# Which generator builds the terrain, and the landscape it builds. `preset` names one of
# the shipped recipes — small | default | wide — and any recipe field written beside it
# overrides that one field. `landform = "ridge"` asks for the original ridge generator
# instead, which is what every fixture and training arena still uses.
#
# The rain, evaporation and water-table keys that used to sit in `[world]` are the
# recipe's business now: `Recipe.water` states the world's whole water inventory in metres
# over the footprint and how it is split between the sky, the aquifer, the soil and the
# pools. The `a M3` and `r M3` stdin commands still add water by hand at run time.
[world.landform]
preset = "default"
