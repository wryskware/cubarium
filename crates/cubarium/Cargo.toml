[package]
name = "cubarium"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Cubarium host: clock, scenes, preview, shim output, captures"

[lib]
name = "cubarium"
path = "src/lib.rs"

[[bin]]
name = "cubarium"
path = "src/main.rs"

[dependencies]
cube-proto = { workspace = true }
cubarium-surface = { workspace = true }
cubarium-render = { workspace = true }
cubarium-gpu = { path = "../cubarium-gpu" }
cubarium-core = { workspace = true }
# Only for `es::export::PolicyFile`: the reader for an exported trained policy, so
# `--neural` loads the same file the trainer wrote rather than a second parser.
cubarium-search = { workspace = true }
cubarium-voxel = { workspace = true }
cubarium-voxel-flora = { workspace = true }
cubarium-voxel-fauna = { workspace = true }
# `profile` is on because the host reports where a tick's milliseconds went in its
# running summary (`voxel/mod.rs`, `Budget`). It is measurement only — one `Instant` per
# phase per tick, about 40 ns each against a tick of milliseconds — and it adds no rule
# and changes no number (`cubarium-voxel/src/profile.rs`).
cubarium-voxel-sim = { workspace = true, features = ["profile"] }
anyhow = { workspace = true }
clap = { workspace = true }
rustc-hash = { workspace = true }
minifb = { workspace = true }
# The development window's raw handles, which `minifb` 0.28 hands out as
# raw-window-handle 0.6 types but does not re-export: the swapchain is made on them
# (`sink/gpu/target.rs`). Already in the lockfile through `minifb`; nothing new resolves.
raw-window-handle = "0.6"
# The development window's own Wayland toplevel (`sink/gpu/wayland.rs`): title and app id
# set before the first commit, configures acknowledged, and the event socket read without
# blocking. Both already in the lockfile through `minifb`; `dlopen`, so no binary links
# libwayland (the board's included).
wayland-client = { version = "0.29", features = ["dlopen"] }
wayland-protocols = { version = "0.29", features = ["client"] }
png = { workspace = true }
toml = "0.8"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
ctrlc = "3"
# OS advisory `flock(2)` for state ownership, and Unix `poll(2)` to accept viewer
# connections promptly without a periodic 10ms request delay.
libc = "0.2"
