[package]
name = "cubarium"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Cubarium host: clock, scenes, preview, shim output, captures"

[lib]
name = "cubarium"
path = "src/lib.rs"

[[bin]]
name = "cubarium"
path = "src/main.rs"

[dependencies]
cube-proto = { workspace = true }
cubarium-surface = { workspace = true }
cubarium-render = { workspace = true }
cubarium-core = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
minifb = { workspace = true }
png = { workspace = true }
toml = "0.8"
serde_json = "1"
ctrlc = "3"
# Only for `flock(2)` on the state directory's `.lock`: an OS advisory lock is the one
# mechanism that makes "exactly one owner" atomic (see `state::StateLock`).
libc = "0.2"
