[package]
name = "cubarium"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Cubarium host: clock, scenes, preview, shim output, captures"

[lib]
name = "cubarium"
path = "src/lib.rs"

[[bin]]
name = "cubarium"
path = "src/main.rs"

# Its mesher and .glb writer carry mechanism tests.
[[example]]
name = "voxel_export"
test = true

[features]
# `examples/pack_profile.rs`'s per-phase pack times. Off, the phase marks compile to
# nothing (`sink/gpu/pack_timer.rs`).
pack-profile = []

[dependencies]
# Byte views of `Pod` data with no `unsafe` (the pack's terrain compare).
bytemuck = "1"
cube-proto = { workspace = true }
cubarium-surface = { workspace = true }
cubarium-render = { workspace = true }
cubarium-gpu = { path = "../cubarium-gpu" }
cubarium-core = { workspace = true }
# Only for `es::export::PolicyFile`: the reader for an exported trained policy, so
# `--neural` loads the same file the trainer wrote rather than a second parser.
cubarium-search = { workspace = true }
cubarium-voxel = { workspace = true }
cubarium-voxel-flora = { workspace = true }
cubarium-voxel-fauna = { workspace = true }
# `--serve`: the running world's stats, the companion dashboard and its speed control
# (`voxel/mod.rs`). Its server is `std::net` only.
cubarium-observatory = { workspace = true }
# The one copy of what is not drawing: the parameter set, making a world, saves, the
# console and the pacing (`voxel/mod.rs`); a Godot session stands on the same crate.
cubarium-session = { workspace = true }
# `profile` is on because the host reports where a tick's milliseconds went in its
# running summary (`voxel/mod.rs`, `Budget`). It is measurement only — one `Instant` per
# phase per tick, about 40 ns each against a tick of milliseconds — and it adds no rule
# and changes no number (`cubarium-voxel/src/profile.rs`).
cubarium-voxel-sim = { workspace = true, features = ["profile"] }
anyhow = { workspace = true }
clap = { workspace = true }
rustc-hash = { workspace = true }
rayon = "1"
minifb = { workspace = true }
# Owned, safe surface handles and events for the GPU development window.
winit = "0.30"
wgpu = "=30.0.1"
png = { workspace = true }
toml = "0.8"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
ctrlc = "3"
# Constants retained for platform error checks.
libc = "0.2"

[lints]
workspace = true

# Safe OS wrappers for locks, readiness, scheduling and signal-driven saves.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "event", "process", "thread"] }
signal-hook = "0.3"

# Physical monitor modes, queried without creating a Wayland surface.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31", features = ["system", "dlopen"] }

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["clock"]
