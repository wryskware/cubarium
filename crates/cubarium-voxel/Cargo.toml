[package]
name = "cubarium-voxel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Voxel ringworld core: materials, terrain generation, water, ledger, save/load. No drawing."

[features]
default = ["parallel"]
# Per-phase timers and work counts for the tick profile
# (`design/7_Research/voxel-tick-profile-2026-09-18.md`). Measurement only: it adds no
# rule, changes no number, and with the feature off every call site is compiled away.
profile = []
# Formerly in-phase multithreading for `water::exchange`'s column scan on a `bevy_tasks`
# pool. Package PA (2026-09-22) made that scan serial again — on the board the pool sat on
# the little cores at an IPC of 0.1 and the scan was 1.7 ms of the tick — so the feature
# pulls nothing in. Kept so `cubarium-voxel-sim`'s `features = ["parallel"]` still resolves.
parallel = []

[dependencies]
anyhow = { workspace = true }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
png = { workspace = true }

[dev-dependencies]
