[package]
name = "cubarium-voxel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Voxel ringworld core: materials, terrain generation, water, ledger, save/load. No drawing."

[features]
default = ["parallel"]
# Per-phase timers and work counts for the tick profile
# (`design/7_Research/voxel-tick-profile-2026-09-18.md`). Measurement only: it adds no
# rule, changes no number, and with the feature off every call site is compiled away.
profile = []
# The water phases on a rayon pool (`cubarium-rules`' host drivers), sized by the caller's
# `threads` (`SimConfig::threads` in the schedule). Without it every phase runs serially
# whatever `threads` says. `design/handoffs/voxel-water-parallel-2026-09-24.md`.
parallel = ["cubarium-rules/par"]

[dependencies]
anyhow = { workspace = true }
cubarium-rules = { workspace = true }
rustc-hash = { workspace = true }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
png = { workspace = true }

[dev-dependencies]
