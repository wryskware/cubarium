[package]
name = "cubarium-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# Stage A depends on nothing else in the workspace on purpose: the renderer is
# defined against its own `Scene` type, so it can be built, run and measured
# while `cubarium-surface` (FW-1) and the world crates are still moving. Stage B
# adds one adapter crate/module from `RenderView` to `Scene`, not a dependency
# in this direction.
[dependencies]
anyhow = { workspace = true }
bytemuck = { version = "1", features = ["derive"] }
png = { workspace = true }
serde_json = "1"
wgpu = { version = "=30.0.1", features = ["spirv", "naga-ir"] }
naga = { version = "=30.0.1", features = ["glsl-in", "msl-out", "hlsl-out", "wgsl-out"] }
pollster = "0.4"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
drm = { version = "0.15", optional = true }
ouroboros = { version = "0.18", optional = true }
rustix = { version = "1", features = ["event", "fs", "net"], optional = true }

[features]
default = ["scanout"]
# Linux panel transport uses safe DRM buffers populated by GPU readback.
scanout = ["dep:drm", "dep:rustix", "dep:ouroboros"]
# wgpu's internal resource and memory counters (diagnostics only).
counters = ["wgpu/counters"]
gpu-counters = ["counters"]

[[example]]
name = "synthetic"

[lints.rust]
warnings = "deny"
