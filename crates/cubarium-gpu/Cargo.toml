[package]
name = "cubarium-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# Stage A depends on nothing else in the workspace on purpose: the renderer is
# defined against its own `Scene` type, so it can be built, run and measured
# while `cubarium-surface` (FW-1) and the world crates are still moving. Stage B
# adds one adapter crate/module from `RenderView` to `Scene`, not a dependency
# in this direction.
[dependencies]
anyhow = { workspace = true }
ash = "0.38"
bytemuck = { version = "1", features = ["derive"] }
png = { workspace = true }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
drm = { version = "0.15", optional = true }
rustix = { version = "1", features = ["event", "fs"], optional = true }

[dependencies.winit]
version = "0.30"
optional = true

[features]
default = ["scanout"]
# The board: linear B8G8R8A8 images exported as dma-bufs, imported into KMS and
# page-flipped at DP-1. Linux only; the crate builds without it everywhere.
scanout = ["dep:drm", "dep:rustix"]
# The desktop development window. Not built on the board (winit is not in its
# crate cache and it has no compositor to show a window in).
window = ["dep:winit"]

[[example]]
name = "synthetic"
