[package]
name = "cubarium-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A presentation-agnostic running world: creation, the loop on its own thread, run control, saves, queries and the view feed. What `cubarium voxel` and the Godot extension both stand on."

[dependencies]
cubarium-voxel = { workspace = true }
cubarium-voxel-flora = { workspace = true }
cubarium-voxel-fauna = { workspace = true }
cubarium-voxel-sim = { workspace = true }
# The founders' trained centres (`EpisodeDriver`, `VoxelPolicyFile`) and the co-training
# parameter files (`--params`). Its Linux-only pieces (pinning, perf counters) are gated
# behind `cfg(target_os = "linux")`, so it builds for macOS.
cubarium-search = { workspace = true }
# The transport-free query layer only: no HTTP server in a session.
cubarium-observatory = { path = "../cubarium-observatory", default-features = false }
anyhow = { workspace = true }
rustc-hash = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# The schema tag at the front of a saved layer, read without decoding the layer.
postcard = { version = "1", features = ["use-std"] }
