[package]
name = "cubarium-voxel-fauna"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Consumers on the voxel strip: paid heuristic browsers that stand on support faces, crop reachable foliage through the flora layer's bounded transfers, and hand their bodies back as carrion. No drawing, no neural policy."

[features]
default = ["parallel"]
# Per-phase timers for the tick profile, forwarding to the core's accumulator. Measurement
# only; see `design/7_Research/voxel-tick-profile-2026-09-18.md`.
profile = ["cubarium-voxel/profile", "cubarium-voxel-flora/profile"]
# In-phase multithreading for `sense`, which is read-only. On by default (Wrysk,
# 2026-09-18); `default-features = false` for a build with no `bevy_tasks`. Never a rule.
parallel = ["dep:bevy_tasks"]

[dependencies]
bevy_tasks = { workspace = true, optional = true }
cubarium-voxel = { workspace = true }
cubarium-voxel-flora = { workspace = true }
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
anyhow = { workspace = true }
rustc-hash = { workspace = true }

# The `grazed` harness carries the crop-attempt/receipt bookkeeping unit tests Astra's
# R10.5 asked for (its own `#[cfg(test)] mod tests`), so it is compiled and run as a test
# target too.
[[example]]
name = "grazed"
test = true
