[package]
name = "cubarium-godot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Godot extension: one class, `CubariumSession`, over cubarium-session. Thin and data-driven: a new species or a new stat needs no change here."

[lib]
crate-type = ["cdylib"]

[dependencies]
cubarium-session = { workspace = true }
# The world's renderer (D-0005): `cubarium-gpu` and its pack, hosted on the session's loop
# (`cubarium::sink::gpu::hosted`), drawn into a texture under the app's UI.
cubarium = { path = "../cubarium" }
# Adapter preference: the renderer opens the GPU Godot draws on.
cubarium-gpu = { path = "../cubarium-gpu" }
cubarium-observatory = { path = "../cubarium-observatory", default-features = false }
# gdext, pinned. 0.5.5 ships the Godot 4.7 API (`api-4-7`), the version at /usr/bin/godot,
# so no custom API generation is needed.
godot = { version = "=0.5.5", default-features = false, features = ["api-4-7"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rustc-hash = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Safe signal saves queue Unix signals for a worker thread.
signal-hook = "0.3"

[lints.rust]
unsafe_code = "deny"
warnings = "deny"
