[package]
name = "cubarium-voxel-flora"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Producers on the voxel strip: stands rooted in support faces, fed by geometric light and pore water through the core's bounded commands. No drawing."

[features]
# Per-phase timers for the tick profile, forwarding to the core's accumulator. Measurement
# only; see `design/7_Research/voxel-tick-profile-2026-09-18.md`.
profile = ["cubarium-voxel/profile"]

[dependencies]
anyhow = { workspace = true }
cubarium-voxel = { workspace = true }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]

# The `two_producers` harness carries the placement-geometry unit tests Astra's R7.1 asked
# for (its own `#[cfg(test)] mod tests`), so it is compiled and run as a test target too.
[[example]]
name = "two_producers"
test = true

# `replacement` carries the study harness's own unit tests — the predeclared site list, the
# refusals, the empty-layer velvetpad check — and the shared `examples/harness` module's cap
# arithmetic tests, so it is compiled and run as a test target too.
[[example]]
name = "replacement"
test = true
