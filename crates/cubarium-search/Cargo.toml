[package]
name = "cubarium-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Headless whole-ecosystem parameter search over the real cubarium-core tick loop"

[lib]
name = "cubarium_search"
path = "src/lib.rs"

[[bin]]
name = "cubarium-search"
path = "src/main.rs"

[dependencies]
cubarium-core = { workspace = true }
cubarium-surface = { workspace = true }
clap = { workspace = true }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: the default parser is not correctly rounded (about one value in nine
# comes back one ULP off), which would make `replay` and any exact-weights claim unsafe.
serde_json = { version = "1", features = ["float_roundtrip"] }
# The calibration exports its selected configuration as the TOML `cubarium run --config` reads.
toml = "0.8"
