[workspace]
resolver = "3"
members = [
    "vendor/cube-proto",
    "crates/cubarium-surface",
    "crates/cubarium-surface-oracle",
    "crates/cubarium-render",
    "crates/cubarium-core",
    "crates/cubarium",
    "crates/cubarium-search",
    "crates/cubarium-gpu",
    "crates/cubarium-voxel",
    "crates/cubarium-voxel-flora",
    "crates/cubarium-voxel-fauna",
    "crates/cubarium-voxel-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
cube-proto = { path = "vendor/cube-proto" }
cubarium-surface = { path = "crates/cubarium-surface" }
cubarium-surface-oracle = { path = "crates/cubarium-surface-oracle" }
cubarium-render = { path = "crates/cubarium-render" }
cubarium-core = { path = "crates/cubarium-core" }
cubarium-search = { path = "crates/cubarium-search" }
cubarium-voxel = { path = "crates/cubarium-voxel" }
cubarium-voxel-flora = { path = "crates/cubarium-voxel-flora" }
cubarium-voxel-fauna = { path = "crates/cubarium-voxel-fauna" }
cubarium-voxel-sim = { path = "crates/cubarium-voxel-sim" }
# The tick's backbone (`crates/cubarium-voxel-sim`) and the in-phase task pool. Kept to
# `std` only: `bevy_reflect`, `backtrace` and the multi-threaded *system* executor are all
# off, because the schedule is a fixed chain and the parallelism lives inside phases
# (`design/handoffs/voxel-schedule-brief-2026-09-18.md`).
bevy_ecs = { version = "0.19", default-features = false, features = ["std"] }
bevy_tasks = { version = "0.19", default-features = false, features = ["multi_threaded"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
minifb = "0.28"
png = "0.18"
proptest = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1
