<!doctype html><meta charset="utf-8"><title>Native coverage study</title>
<style>body{background:#101418;color:#ddd;font:16px system-ui;margin:24px} canvas{image-rendering:pixelated;display:block;background:#000;margin:8px 0} .large{width:768px;height:384px;max-width:100%;object-fit:contain;object-position:left}section{display:inline-block;vertical-align:top;margin-right:24px}button,input{font:inherit}small{display:block}</style>
<h1>Same authored motion, 60 samples/s</h1><p>Left: current point bake. Right: offline 4×4 coverage bake. Both use current runtime bilinear sampling and frame blending. Native faces first; enlarged copy below. Six-second excerpt repeats with a replay cut; that cut is not an animation-loop test.</p>
<label>Scene <select id="scene"><option>rooted</option><option>translated</option><option>juvenile</option><option>seam</option><option>rim</option><option>vertex</option><option>quiet</option></select></label>
<button id="toggle">Pause</button> <input id="frame" type="range" min="0" max="359" value="0" aria-label="Frame"> <output id="count"></output><main></main>
<script>
const names=['lanternstalk','reedspire','sail','skimmer'], views=[];
for(const name of names){const section=document.createElement('section'); section.innerHTML=`<h2>${name}</h2><small>Current / coverage bake</small><canvas width="128" height="64"></canvas><canvas class="large" width="128" height="64"></canvas>`;document.querySelector('main').append(section);const image=new Image();views.push({name,image,canvases:[...section.querySelectorAll('canvas')]});}
let width=128,height=64;
document.querySelector('#scene').onchange=()=>{const scene=document.querySelector('#scene').value, net=['seam','rim','vertex'].includes(scene);width=net?512:128;height=net?128:64;for(const view of views){view.image.src=view.name+'-'+scene+'-motion.png';for(const c of view.canvases){c.width=width;c.height=height;if(c.className==='large'){c.style.width=width*(net?2:6)+'px';c.style.height=height*(net?2:6)+'px';}}}};
document.querySelector('#scene').onchange();
let playing=true, epoch=performance.now(), index=0;
const slider=document.querySelector('#frame');
document.querySelector('#toggle').onclick=()=>{playing=!playing;epoch=performance.now()-index*1000/60;document.querySelector('#toggle').textContent=playing?'Pause':'Play';};
slider.oninput=()=>{index=Number(slider.value);epoch=performance.now()-index*1000/60;};
function draw(now){if(playing)index=Math.floor((now-epoch)*60/1000)%360; slider.value=index;document.querySelector('#count').textContent=`${index}/359 (${(index/60).toFixed(3)}s)`;for(const view of views)if(view.image.complete&&view.image.naturalWidth)for(const canvas of view.canvases){const c=canvas.getContext('2d');c.imageSmoothingEnabled=false;c.drawImage(view.image,index%15*width,Math.floor(index/15)*height,width,height,0,0,width,height);}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script>
