# External census promotion gate; this is not the Rust search objective.
# Numerical targets/weights remain provisional pending Wrysk.
# Stock samples/events use half-open [from, to) whole simulation minutes.
# Interval telemetry is timestamped at its end: (from, to] covers [from, to).
# End census is a required boundary stock, excluded from late snapshot means.
version = 2

# All choices below are provisional pending Wrysk: training-plan-2026-10-08 §6 Q5.
[weights]
L = 100.0 # Required lineage/species loss; provisional pending Wrysk.
J = 10.0 # Mean reproductive deficit; provisional pending Wrysk.
Q = 5.0 # Cycle replenishment deficit (NA without books); provisional pending Wrysk.
A = 2.0 # Late population band deficit; provisional pending Wrysk.
K = 2.0 # Population peak excess; provisional pending Wrysk.
V = 10.0 # Browser movement deficit; provisional pending Wrysk.
Z = 2.0 # Free lanternjaw population share; provisional pending Wrysk.
M = 3.0 # Largest meadow area deficit; provisional pending Wrysk.
G_b = 1.0 # Largest lanternberry grove deficit; provisional pending Wrysk.
G_v = 1.0 # New vaulttree recruitment deficit; provisional pending Wrysk.
H = 1.0 # Kill rate (kills per world-hour) outside band; provisional pending Wrysk.
F = 3.0 # Low-tail fullness deficit; provisional pending Wrysk.
S = 5.0 # Observed stuck body share; provisional pending Wrysk.

[population]
k_hi = 3.0 # Upper late population band as N_ref multiple; provisional pending Wrysk.
k_peak = 5.0 # Unpenalised peak as N_ref multiple; provisional pending Wrysk.

# Required names and N_ref come exclusively from batch.json, never loaded survivors.

[targets]
moving_lineage = "frondgrazer" # Browser used for V; provisional pending Wrysk.
moving_share = 0.30 # Awake body-time moving fraction target; provisional pending Wrysk.
predator_lineage = "lanternjaw" # Predator share used for Z; provisional pending Wrysk.
predator_share_lo = 0.05 # Minimum share of all animal bodies; provisional pending Wrysk.
predator_share_hi = 0.15 # Maximum share of all animal bodies; provisional pending Wrysk.
voxel_m = 0.125 # Metres per patch face edge; provisional pending Wrysk.
meadow_m2 = 2.0 # Largest connected meadow area target; provisional pending Wrysk.
grove_m2 = 0.5 # Largest connected lanternberry grove target; provisional pending Wrysk.
vaulttree_recruits = 1.0 # New recruits over the window target; provisional pending Wrysk.
hunt_lineages = ["chorister", "lanternjaw"] # Hunters counted by H; provisional pending Wrysk.
hunts_per_hour_lo = 0.5 # Minimum kills per simulated world-hour; provisional pending Wrysk.
hunts_per_hour_hi = 2.0 # Maximum kills per simulated world-hour; provisional pending Wrysk.
fullness_p10 = 0.3 # F = mean lineage, mean minute h(fullness_p10 / this target); vitals emits p10, not p25; provisional pending Wrysk.

[reproduction]
eligible_deficit = 0.5 # J without a late birth but breeding possible; provisional pending Wrysk.
ineligible_deficit = 1.0 # J without a late birth or eligible body; provisional pending Wrysk.

[summary]
sd_weight = 0.5 # Soft arm rank = mean P without L plus this times sample SD; feasibility first; provisional pending Wrysk.
consistent_fraction = 0.75 # Same-sign paired seed fraction (6/8); provisional pending Wrysk.
consistent_min_seeds = 8 # Minimum paired seeds before claiming consistency; provisional pending Wrysk.

[profiles.screen-2h]
from_minute = 0
to_minute = 120
active = ["L", "J", "A", "K", "V", "Z", "M", "G_b", "G_v", "H", "F", "S"]
aggregation = "mean + sd_weight * sample_sd of soft P (L excluded); feasibility first"
slow = ["chorister", "lanternjaw"] # lifecycle untested in this profile
start_kind = "mature saved start"

[profiles.screen-2h.disabled]
Q = "Off: conserved full-cycle inflow/stock books are not yet available in this paired two-hour screen."

# Required columns are checked on every row, never averaged over whichever log exists.
[profiles.screen-2h.required_data]
L = ["census:stocks"]
J = ["vitals:breeding_eligible_n", "life:recruits", "census:lifecycle"]
A = ["census:stocks"]
K = ["census:stocks"]
V = ["vitals:moving_share", "vitals:awake_body_s"]
Z = ["census:stocks"]
M = ["census:meadow_patch_max"]
G_b = ["census:grove_patch_max"]
G_v = ["census:recruits_vaulttree"]
H = ["census:kills"]
F = ["vitals:fullness_p10", "vitals:n"]
S = ["vitals:stuck_n", "vitals:stuck_observed_n"]

[profiles.screen-2h.trend_weights]
count_slope = 0.0
count_drawdown = 0.0
energy_trend = 0.0
plant_stand_slope = 0.0
plant_vigour_trend = 0.0

# screen-2h for batches run before the census wrote a load-boundary row (binaries before
# 1ea9dfce): the window starts one minute after the load, so counter deltas have an
# opening row. Compare only within the same profile.
[profiles.screen-2h-legacy]
from_minute = 1
to_minute = 120
active = ["L", "J", "A", "K", "V", "Z", "M", "G_b", "G_v", "H", "F", "S"]
aggregation = "mean + sd_weight * sample_sd of soft P (L excluded); feasibility first"
slow = ["chorister", "lanternjaw"] # lifecycle untested in this profile
start_kind = "mature saved start"

[profiles.screen-2h-legacy.disabled]
Q = "Off: conserved full-cycle inflow/stock books are not yet available in this paired two-hour screen."

# Required columns are checked on every row, never averaged over whichever log exists.
[profiles.screen-2h-legacy.required_data]
L = ["census:stocks"]
J = ["vitals:breeding_eligible_n", "life:recruits", "census:lifecycle"]
A = ["census:stocks"]
K = ["census:stocks"]
V = ["vitals:moving_share", "vitals:awake_body_s"]
Z = ["census:stocks"]
M = ["census:meadow_patch_max"]
G_b = ["census:grove_patch_max"]
G_v = ["census:recruits_vaulttree"]
H = ["census:kills"]
F = ["vitals:fullness_p10", "vitals:n"]
S = ["vitals:stuck_n", "vitals:stuck_observed_n"]

[profiles.screen-2h-legacy.trend_weights]
count_slope = 0.0
count_drawdown = 0.0
energy_trend = 0.0
plant_stand_slope = 0.0
plant_vigour_trend = 0.0

# A plumbing smoke only (scripts/studies/eco_search.py's loop test): six simulated minutes
# of a fresh founding. Not an objective; its scores say nothing about the ecology.
[profiles.smoke-6m]
from_minute = 0
to_minute = 6
active = ["L", "J", "A", "K", "V", "Z", "M", "G_b", "G_v", "H", "F", "S"]
aggregation = "mean + sd_weight * sample_sd of soft P (L excluded); feasibility first"
slow = ["chorister", "lanternjaw"]
start_kind = "fresh founding"

[profiles.smoke-6m.disabled]
Q = "Off: no cycle books in a six-minute plumbing smoke."

[profiles.smoke-6m.required_data]
L = ["census:stocks"]
J = ["vitals:breeding_eligible_n", "life:recruits", "census:lifecycle"]
A = ["census:stocks"]
K = ["census:stocks"]
V = ["vitals:moving_share", "vitals:awake_body_s"]
Z = ["census:stocks"]
M = ["census:meadow_patch_max"]
G_b = ["census:grove_patch_max"]
G_v = ["census:recruits_vaulttree"]
H = ["census:kills"]
F = ["vitals:fullness_p10", "vitals:n"]
S = ["vitals:stuck_n", "vitals:stuck_observed_n"]

[profiles.smoke-6m.trend_weights]
count_slope = 0.0
count_drawdown = 0.0
energy_trend = 0.0
plant_stand_slope = 0.0
plant_vigour_trend = 0.0

# Brain gates (scripts/studies/batch.py, fresh founding, 1 h): a trained policy against the
# built-in C1 and the heuristic on the same seeds. Slow clocks barely move in an hour, so J
# and the band terms speak mostly to founding; read the per-lineage table for the trained
# lineages first. On a no-predator map Z and H are the same penalty in every arm.
[profiles.gate-1h]
from_minute = 0
to_minute = 60
active = ["L", "J", "A", "K", "V", "Z", "M", "G_b", "G_v", "H", "F", "S"]
aggregation = "mean + sd_weight * sample_sd of soft P (L excluded); feasibility first"
slow = ["chorister", "lanternjaw"]
start_kind = "fresh founding"

[profiles.gate-1h.disabled]
Q = "Off: no cycle books in a one-hour gate."

[profiles.gate-1h.required_data]
L = ["census:stocks"]
J = ["vitals:breeding_eligible_n", "life:recruits", "census:lifecycle"]
A = ["census:stocks"]
K = ["census:stocks"]
V = ["vitals:moving_share", "vitals:awake_body_s"]
Z = ["census:stocks"]
M = ["census:meadow_patch_max"]
G_b = ["census:grove_patch_max"]
G_v = ["census:recruits_vaulttree"]
H = ["census:kills"]
F = ["vitals:fullness_p10", "vitals:n"]
S = ["vitals:stuck_n", "vitals:stuck_observed_n"]

[profiles.gate-1h.trend_weights]
count_slope = 0.0
count_drawdown = 0.0
energy_trend = 0.0
plant_stand_slope = 0.0
plant_vigour_trend = 0.0
