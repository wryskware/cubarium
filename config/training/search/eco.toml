# The ecology search's real genome (training plan 2026-10-08 §6 item 10, build order step 4):
# per-lineage body mass, the gut ceiling, and two supply genes.
#
# Wrysk's route (item 10, 2026-10-09): raise each lineage's `mass_scale` (body, reserves, gut
# and upkeep scale together, so starvation time is unchanged), bring the gut ceiling from
# 18-45x upkeep to the real 3-7x, keep foliage yield 0.5, plant defence per bite as a
# secondary gene, never slow the plants. Target: leaf eaters eat 10-30 % of leaf growth and
# every lineage persists. Vine flowers and fruit are left to ecology (`spur_share`).
#
# GUT-MASS (2026-10-10) shipped that route as the defaults of every shipped preset, so every
# gene here is centred on x1 = the shipped world (the wide terrarium). Shipped, against the
# old mass_scale 30: frondgrazer and loftstrider x800, Veilhound x400, seedporter x2.5,
# bellwing, capgnawer, littershredder, lanternjaw and ripple-snail x2; every gut ceiling at
# 7x maintenance; a grown lanternjaw's window factor 12 x (Veilhound mass / its own). The
# budget behind them is in the training plan (GUT-MASS). The boxes bracket Wrysk's ranges
# (frondgrazer x25-75, loftstrider x4-12, fruit/nectar/cap eaters x2-6, ceiling 3-7x) and
# the budget's picks, except where a size-window guard below forbids it.
#
# Genes are world numbers only: no behaviour, no score terms. x1 is the world the genome is
# decoded over (the wide terrarium preset, or a save's own configs beside `load=`). Each
# gene's `value` is the CMA start; `eco_search.py` reads it as the starting mean.
#
# Guards (the predation size windows read org-unit bodies, so per-lineage masses move them;
# ties and box edges keep the roles' windows):
# - mass_grazer moves the frondgrazer, the Veilhound (`chorister`) and the loftstrider. The
#   Veilhound must take an adult frondgrazer (its prey_max_ratio 1.5x its body: vh_ratio's
#   lower edge, 0.4 of the frondgrazer's factor at the old masses) and a lone one must not
#   take an adult loftstrider (ls_ratio's lower edge). So Wrysk's loftstrider x4-12 is not
#   in the box: a Veilhound heavy enough for frondgrazers would take loftstriders that light.
# - A grown lanternjaw stays out of a lone Veilhound's window: its adult_size_window_factor
#   follows the Veilhound's mass (mass_grazer, vh_ratio) over its own (mass_capgnawer,
#   mass_lanternjaw, inversely).
# - mass_capgnawer moves the capgnawer AND the lanternjaw, and mass_lanternjaw (box from 1)
#   moves the lanternjaw alone: the lanternjaw never falls below today's reach over its
#   main prey, capgnawers and bellwings (role call 7 B's guard).
# - mass_shredder moves the littershredder AND the seedporter, and mass_seedporter's lower
#   edge keeps a full-grown seedporter's window over a full-grown littershredder
#   (SP-SHREDDER). The lanternjaw's larvae ride littershredders that bear 4x their body:
#   moving mass_shredder far below mass_capgnawer x mass_lanternjaw would leave them few
#   hosts (not tied; read the rider counts).
# - mass_scale carries its seven absolute quantities (registry tie "mass"; the browser's
#   placeholder species follows the frondgrazer). Taste references and bite half-stock
#   stay in food units and do not follow mass_scale.
# - gut: every lineage's bite_per_body_s x S and every digestion time / S (the webmodel's
#   own gut-throughput knob, `web_model gut=`), so the gut ceiling y.k/tau moves by S and
#   the bite keeps asking twice the gut's throughput.
#
# mass_scale is a digest row (a trained brain's senses read it), so the file says
# retrain = true. No trained brain runs in the world now (DROP-C1); a brain trained later
# is trained at the masses this search picks.
#
# Launch: scripts/studies/eco-wide-screen.sh (protocol A screen, from year-old wide saves).

retrain = true

# The search loader expands over this founding roster; voxel_census still uses
# its explicit world config (or the loaded save), as eco_search.py supplies it.
[base]
file = "config/desktop/terrarium-wide.toml"

# --- Body mass, per lineage (x the shipped preset's mass_scale) ---

[[gene]]
name = "mass_grazer"
path = ["fauna.founders.frondgrazer.mass_scale", "fauna.founders.chorister.mass_scale",
        "fauna.founders.loftstrider.mass_scale", "fauna.founders.lanternjaw.adult_size_window_factor"]
range = [0.03, 3.0]
value = 1.0
what = "frondgrazer body mass (the Veilhound and loftstrider with it): x0.03 is Wrysk's x25 of the old mass, x3 the budget's 30 % offtake at the band's top headcount on half today's leaf supply"

[[gene]]
name = "vh_ratio"
path = ["fauna.founders.chorister.mass_scale", "fauna.founders.lanternjaw.adult_size_window_factor"]
range = [0.8, 2.0]
value = 1.0
what = "Veilhound mass over its shipped tie to the frondgrazer (0.5 of its factor): 0.8 is the lightest pack that still takes an adult frondgrazer (1.5x prey cap), 2 the old equal ratio (twice the frondgrazer kills per hour)"

[[gene]]
name = "ls_ratio"
path = "fauna.founders.loftstrider.mass_scale"
range = [0.8, 2.5]
value = 1.0
what = "loftstrider mass over its tie to the frondgrazer: 0.8 keeps a grown loftstrider out of a lone Veilhound's window at vh_ratio 2; it is life-history-limited, so its mass sets its leaf take and its calves' worth to the pack"

[[gene]]
name = "mass_seedporter"
path = "fauna.founders.seedporter.mass_scale"
range = [0.85, 3.2]
value = 1.0
what = "seedporter body mass beside mass_shredder (shipped x2.5 of the old): 0.85 keeps a grown seedporter's window over a grown littershredder; 3.2 is Wrysk's x6 (with mass_shredder x1, about x8)"

[[gene]]
name = "mass_bellwing"
path = "fauna.founders.bellwing.mass_scale"
range = [0.5, 3.0]
value = 1.0
what = "bellwing body mass (shipped x2): Wrysk's x2-6 and down to x1; nectar-limited, so its numbers fall about as 1/k"

[[gene]]
name = "mass_capgnawer"
path = ["fauna.founders.capgnawer.mass_scale", "fauna.founders.lanternjaw.mass_scale"]
inverse = "fauna.founders.lanternjaw.adult_size_window_factor"
range = [0.5, 3.0]
value = 1.0
what = "capgnawer body mass (shipped x2), the lanternjaw with it (its guard): Wrysk's x2-6 and down to x1"

[[gene]]
name = "mass_lanternjaw"
path = "fauna.founders.lanternjaw.mass_scale"
inverse = "fauna.founders.lanternjaw.adult_size_window_factor"
range = [1.0, 3.0]
value = 1.0
what = "lanternjaw mass over the capgnawer's: from 1 (role call 7 B's guard, its reach over capgnawers and bellwings no less than today's) to 3"

[[gene]]
name = "mass_shredder"
path = ["fauna.founders.littershredder.mass_scale", "fauna.founders.seedporter.mass_scale"]
range = [0.5, 4.0]
value = 1.0
what = "littershredder body mass (shipped x2), the seedporter with it (its catch window); x1-8 of the old: litter supply covers need many times over at band numbers"

[[gene]]
name = "mass_snail"
path = "fauna.founders.ripple-snail.mass_scale"
range = [0.5, 2.0]
value = 1.0
what = "ripple-snail body mass (shipped x2): film-limited, so N falls about as 1/k; the box is the old x1-4"

# --- The gut ceiling (y . stomach_k / digestion_s over maintenance_per_s) ---

[[gene]]
name = "gut"
path = "fauna.founders.*.gut.bite_per_body_s"
inverse = "fauna.founders.*.gut.digestion_s.*"
range = [0.43, 2.33]
value = 1.0
what = "gut throughput S over the shipped ceilings (every lineage at 7x maintenance): 0.43 is Wrysk's 3x; 2.33 is 16x, where a frondgrazer at its measured gut use (0.35) pays a calf per world day"

# --- Supply ---

[[gene]]
name = "defence"
path = "flora.*.defence_per_bite"
range = [1.0, 30.0]
value = 5.5
what = "induced plant defence per bite, every plant (glowcap caps included); secondary (Wrysk); FOOD-BUDGET's x1-30, start at the log centre"

[[gene]]
name = "spur_share"
path = "flora.latticevine.spur_share"
range = [0.25, 4.0]
value = 1.0
what = "share of latticevine growth into flowers and fruit (0.1 -> 0.025-0.4); Wrysk 2026-10-09: left to ecology"
