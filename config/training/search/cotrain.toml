# Stage 1 of co-training: the ecology search's genome
# (design/handoffs/cotrain-stage0-2026-10-01.md §2; registry proposal §4).
#
# 40 multipliers, x1 = today's world. Each range reaches the knob's real-world baseline
# (audit §6, parameters.tsv `real_world`), so the search can move there itself; the
# baseline each was sized for is in its `what`. Not genes: the digest rows (mass scale,
# body size, the eye and mouth anchors, cruise, cone, taste) - mass stays at x30.
#
# Derived fields follow their bases (fauna and flora `ties()`): walking keeps its ratio to
# upkeep (`motor` is that ratio), dead wood and carrion rot with the litter, a seed bank's
# attrition follows its age limit. Since the minimal gut (2026-10-03) the bite is its own
# gene (`bite`, the stomach's body-scaled rate), not tied to upkeep; the upkeep gene is x1
# at the gut's daily need f / 7,200 s.

[screen]
# The R/S/F pre-screen (audit §1.4): a candidate outside these takes, unrun,
# max(base, worst run this generation + 1) + k x (its log-distance outside the bands).
r = [0.02, 0.3]
s = [0.02, 0.2]
f_min = 10.0
base = 200.0
k = 10.0
# The soft margin: within run_margin of the bands (R, S in [lo/m, hi*m], F >= f_min/m) a
# candidate still runs, paying k_soft x its log-distance outside them on top of its runs.
run_margin = 2.0
k_soft = 5.0
# The light-and-moisture factor on a plant's income, and the share of a field's edible
# foliage a walker harvests in passing (invariants.py's 0.67 and 0.2).
light_moisture = 0.67
harvest = 0.2
# R is a readout (the minimal gut, design/metabolism-meals-2026-10-02.md "What changes
# elsewhere": R/S/F stays a readout or soft): its band was set for the old upkeep, and at
# the gut's daily need f every terrarium candidate's R is ~100x over it. S and F stay hard.
r_readout = true

[targets]
# Persistence only (bodies plus viable eggs; no share, no late-breeding target): none.
# Stage 1 held the lanternjaw so on 1 h horizons; stage 2 runs 2 h.
persist_only = []
# Exempt from the breeding term alone (persistence and share still apply): the
# lanternjaw. A hatchling of the first dusk (~min 60) grows to birth_body in ~117 min and
# holds surplus 12 more before it lays; its eggs hatch only at a later dusk.
breed_exempt = ["lanternjaw"]
# The moving-share term's weight: a still browser costs on the scale of a non-breeding
# lineage (missing_cost 10).
lively_weight = 10.0
# A lineage alive with no late birth pays missing_cost x (1 - min(1, readiness / this)),
# readiness its bodies' second-half mean breeding progress (1 gestating, else half the
# reserve toward the surplus line plus half the surplus hold met; below birth_body only
# the reserve half).
ready_target = 0.5

# --- Animals: one gene per lineage (littershredder, frondgrazer, lanternjaw). ---

[[gene]]
name = "starter_litter"
path = "fauna.founding.starter_litter_organic"
tie = "all"
range = [0.25, 5.0]
what = "leaf litter laid under each seeded shredder (0.2 = ~0.5 body at x30); founders die before finding litter"

[[gene]]
name = "upkeep"
path = "fauna.founders.*.core.maintenance_per_s"
tie = "each"
range = [0.1, 4.0]
what = "basal upkeep; real: browser x1 (the reference clock), shredder x0.14-0.4 (ectotherm)"

[[gene]]
name = "motor"
path = "fauna.founders.*.motor_respiration_per_s"
tie = "each"
range = [0.5, 10.0]
what = "walking cost / upkeep (motor_factor); real: mammal x1-2.5, shredder x3-8"

[[gene]]
name = "bite"
path = "fauna.founders.*.gut.bite_per_body_s"
tie = "each"
range = [0.25, 4.0]
what = "the stomach's bite rate b, raw food per unit body per second (default 2k / tau); its own gene since the minimal gut, replacing `intake` on the unread bite_per_s"

[[gene]]
name = "yield"
path = "fauna.founders.*.yield_by_food.*"
tie = "each"
range = [0.1, 1.8]
what = "assimilation yield; real: litter x0.1-0.6, browse x0.8-1.4, carrion x1.6-1.8"

[[gene]]
name = "breed_reserve"
path = "fauna.founders.*.core.reproduction.surplus_floor"
tie = "each"
range = [0.25, 4.0]
what = "the reserve margin a body breeds above; no real analog"

[[gene]]
name = "lifespan"
path = "fauna.founders.*.core.lifespan_median_s"
tie = "each"
range = [0.25, 16.0]
what = "median lifespan; real: x1.5-3.7 (wild median), x15 (maximum)"

[[gene]]
name = "gestation"
path = ["fauna.founders.*.core.reproduction.gestation_s", "fauna.founders.*.core.reproduction.incubation_s"]
tie = "each"
range = [0.25, 32.0]
what = "gestation and incubation; real: gestation x21-29, incubation x3-6"

[[gene]]
name = "maturity"
path = "fauna.founders.*.core.growth_max_per_s"
tie = "each"
range = [0.05, 4.0]
# LJ-GROW-B: x1 retains the shipped ceilings (lanternjaw 3e-4 ou/s); the
# registry's 1e-2 upper limit also contains the largest shipped ceiling at x4.
what = "growth to breeding size; real: x0.12-0.25 (maturity 4-8x fast)"

# --- The biological clock (registry decision 2): neutral at x1. ---

[[gene]]
name = "K_bio"
path = "@bio_rate"
inverse = "@bio_time"
range = [0.25, 4.0]
what = "every biological rate faster, every life-history time shorter, together"

# --- Plants: one gene per functional group (turf, mat, shrub, tree). ---

[[gene]]
name = "growth@turf"
path = "flora.@turf.foliage_rate"
range = [0.1, 4.0]
what = "foliage regrowth cap; real: x1 by the clock (herb regrowth 2-4 weeks)"

[[gene]]
name = "growth@mat"
path = "flora.@mat.foliage_rate"
range = [0.1, 4.0]
what = "foliage regrowth cap; real: x1 by the clock (herb regrowth 2-4 weeks)"

[[gene]]
name = "growth@shrub"
path = "flora.@shrub.foliage_rate"
range = [0.1, 4.0]
what = "foliage regrowth cap; real: x1 by the clock (herb regrowth 2-4 weeks)"

[[gene]]
name = "growth@tree"
path = "flora.@tree.foliage_rate"
range = [0.1, 4.0]
what = "foliage regrowth cap; real: x1 by the clock (herb regrowth 2-4 weeks)"

[[gene]]
name = "leaf_fall@turf"
path = "flora.@turf.senescence"
# LEAF-LIFE, Wrysk 2026-10-10: multipliers of the new leaf-life base; x1 is inside these bounds.
range = [0.05, 4.0]
what = "leaf fall multiplier over the LEAF-LIFE growth-form baseline"

[[gene]]
name = "leaf_fall@mat"
path = "flora.@mat.senescence"
# LEAF-LIFE, Wrysk 2026-10-10: multipliers of the new leaf-life base; x1 is inside these bounds.
range = [0.05, 4.0]
what = "leaf fall multiplier over the LEAF-LIFE growth-form baseline"

[[gene]]
name = "leaf_fall@shrub"
path = "flora.@shrub.senescence"
# LEAF-LIFE, Wrysk 2026-10-10: multipliers of the new leaf-life base; x1 is inside these bounds.
range = [0.05, 4.0]
what = "leaf fall multiplier over the LEAF-LIFE growth-form baseline"

[[gene]]
name = "leaf_fall@tree"
path = "flora.@tree.senescence"
# LEAF-LIFE, Wrysk 2026-10-10: multipliers of the new leaf-life base; x1 is inside these bounds.
range = [0.05, 4.0]
what = "leaf fall multiplier over the LEAF-LIFE growth-form baseline"

[[gene]]
name = "alpha@turf"
path = "flora.@turf.alpha"
range = [0.25, 2.0]
what = "foliage per unit wood; real: herbs 1-2 (x0.5-1)"

[[gene]]
name = "alpha@mat"
path = "flora.@mat.alpha"
range = [0.25, 2.0]
what = "foliage per unit wood; real: mats 1-2 (x0.5-1)"

[[gene]]
name = "alpha@shrub"
path = "flora.@shrub.alpha"
range = [0.05, 2.0]
what = "foliage per unit wood; real: shrubs 0.2-0.5 (x0.1-0.25)"

[[gene]]
name = "alpha@tree"
path = "flora.@tree.alpha"
range = [0.005, 2.0]
what = "foliage per unit wood; real: trees 0.02-0.1 (x0.01-0.05)"

# --- The grazing defence and decomposition. ---

[[gene]]
name = "defence_onset"
path = "flora.@photo.defence_per_bite"
range = [0.25, 8.0]
what = "defence rise per bite; real: on within minutes of grazing (x2-5)"

[[gene]]
name = "defence_relax"
path = "flora.@photo.defence_half_life_s"
range = [0.03, 4.0]
what = "defence half-life; real: days-weeks by the clock (x0.04-0.4)"

[[gene]]
name = "decomposition"
path = "flora.decomposition"
range = [0.1, 4.0]
what = "litter decay (dead wood and carrion follow); real: x0.1-0.38"

# The minimal gut's digestion times, independent of the biological clock.
[[gene]]
name = "tau"
path = "fauna.founders.*.gut.digestion_s.*"
tie = "each"
range = [0.25, 4.0]
what = "digestion time per searched founder; a food pool empties at S / tau"
