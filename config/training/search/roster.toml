# The full-roster ecology search (design/ecology-timescales-2026-10-02.md Part 3;
# design/handoffs/roster-search-groundwork-2026-10-02.md). Ecology only: brains held.
#
# x1 is the LIVE TERRARIUM: every gene multiplies the value `[base]` gives it, the desktop
# terrarium preset's own [flora] and [fauna] tables (the curiosity gate's ecology, all nine
# lineages founded, glassfilm seeded) over the code defaults. So a genome found here is
# watched exactly with
#   ./scripts/run-voxel.sh --config config/desktop/terrarium.toml --params <genome.toml>
# (the app decodes a genome over its config's tables). A saved genome carries the base
# inline. Run with `--world config/desktop/terrarium.toml`; the founding counts are the
# base's (all nine), not the code defaults' three.
#
# Ties (`derive()`, fauna and flora `ties()`), in force unless freed:
# - motor_respiration_per_s follows maintenance_per_s by ratio: the UPKEEP gene also moves
#   walking cost (no motor gene: frozen ratio). The bite does not: since the minimal gut
#   (design/metabolism-meals-2026-10-02.md repair 2 item 11) it is its own gene, `bite`.
# - wood_decomposition and carrion_decomposition follow `decomposition`.
# - The mass ties (eight stocks follow mass_scale) are idle: mass is not a gene.
#
# Launch (the overnight is Fable's, after Astra reviews the screens and targets):
#   CUBARIUM_THREADS=1 cubarium-search voxel-ecology-search \
#     --search config/training/search/roster.toml --start config/training/search/roster-exhibit.toml \
#     --world config/desktop/terrarium.toml --hours 2 --seeds-per-generation 8 --threads N
# CUBARIUM_THREADS=1 keeps each world on one thread (the world's own pool otherwise takes
# every core but one per world). Finalists:
#   voxel-ecology-check --finalist --arm best=<run>/best.toml --world config/desktop/terrarium.toml

[base]
file = "config/desktop/terrarium.toml"
# The night package (2c7fd076) is in the code defaults under it: founders arrive full
# (arrival_reserve 1.0), wake_hunger 0.9, sleep_upkeep 0.3 / 0.5, the plants' night budget
# with night_bloom_scale 0.3 (a gene below).

# Brains (ecology only, no brain pairs): the shredders and browsers on the curiosity gate's
# C1 centres, everyone else on its heuristic. `--centre` overrides.
[brains]
littershredder = "config/training/curiosity-2026-10-02/C1-centre-littershredder.json"
frondgrazer = "config/training/curiosity-2026-10-02/C1-centre-frondgrazer.json"

[screen]
# R/S/F (the browser on foliage), as cotrain.toml.
r = [0.02, 0.3]
s = [0.02, 0.2]
f_min = 10.0
base = 200.0
k = 10.0
run_margin = 2.0
k_soft = 5.0
light_moisture = 0.67
harvest = 0.2
# R is a readout here, not a refusal (Fable 2026-10-02): its band was set for the old clock,
# and the movement target and the curiosity brains handle parking. S and F stay hard.
r_readout = true

# Night endurance, optimistic adult (proposal 1a; Astra A2): from onset reserve f0 and a
# stomach at the appetite floor s0 K digested at its best yield y (the minimal gut),
# (max(0, f0 - (1 - h)) x c + s0 k y) / (m x s) >= margin x the lineage's longest sleeping
# bout on the world's clock (daylight lines 0.3; crepuscular 0.05 / 0.95). Exact.
[screen.night]
f0 = 0.8
margin = 1.2

# Food access per food type (proposal Part 3; Astra A5, A11): each founded lineage's basal
# need over a day (the gut's daily need f, awake plus asleep at sleep_upkeep, assimilated
# units) against its foods'
# optimistic supply at founding (stands min(founder_cap, founder_per_m2 x floor area),
# continuous harvest, no competition, no stock caps). Necessary, not sufficient.
[screen.food]
min_ratio = 1.0
# Latticevine faces per founded vine, flowering back to back: the founding roots each vine
# on one face, and the founded terrarium has exactly that (12 vines, 12 faces, seeds 1-8).
vine_faces_founded = 1.0
# Predator balance (a READOUT, never a refusal; Astra A6): the share of prey production
# allotted to each predator lineage.
balance_share = 0.5

[targets]
# Targets v3: per lineage and life stage (proposal Part 3; Astra A10).
version = 3
# An actual birth in the second half is required; readiness earns at most
# birth_credit_max of the term and never meets it.
birth_required = ["littershredder", "frondgrazer", "capgnawer", "loftstrider", "ripple-snail", "bellwing", "seedporter"]
birth_credit_max = 0.5
ready_target = 0.5
# Progress ladders where no birth fits 2 h: the lanternjaw (0.25 hatched from the bank,
# 0.5 a rider attached, rising to 0.75 as the furthest rider nears its drop-off line, 0.75 a
# juvenile off its host, 1 a free lanternjaw's hit landed or an adult laying), met at
# lanternjaw_progress; the chorister (a litter, pups provisioned, pup
# survival at least chorister_pup_survival, and the pack's own intake: a kill or carcass
# feeding; a pack kill in finalist validation), met at all four.
progress = ["lanternjaw", "chorister"]
lanternjaw_progress = 0.5
chorister_pup_survival = 0.5
# Replenishment over one whole day-cycle: intake over the cycle's measured spending, at
# least 1. The stock is body, reserve, escrow and the digestible stomach, and intake is
# assimilation plus the stomach's digestible change (the minimal gut), so food moved from
# stomach to reserve is not income.
replenish = ["littershredder", "frondgrazer", "capgnawer", "loftstrider", "ripple-snail", "bellwing", "seedporter", "chorister"]
replenish_weight = 5.0
# Kept: persistence, the band, browsers moving >= 0.30, lanternjaw share 5-15 % scored
# softly while it cannot establish (its weight x this until a free-living hunter exists).
lively_weight = 10.0
share_weight_unestablished = 0.2
# Continuous balance (the search rebase's addendum, Wrysk 2026-10-03): with the gut a full
# adult lasts 3-25 world days, so alive counts after 2 h no longer show starvation.
# - Each lineage in `balance` pays balance_weight x its soft shortfall on B >= 1 and
#   R-hat >= 1 (live/balance.rs); persistence stays hard.
# - counts_readout: the population band, its peak and the lanternjaw share are readouts.
# - The chorister, lanternjaw and loftstrider are readout-only: a founders-only world has
#   not established their food (too few prey; no vaulttree groves). Staged arrival is a
#   separate proposal.
readout_only = ["chorister", "lanternjaw", "loftstrider"]
balance = ["littershredder", "frondgrazer", "capgnawer", "ripple-snail", "bellwing", "seedporter"]
balance_weight = 5.0
counts_readout = true

# --- Animals: per lineage (tie = "each" over the nine founded lineages). Frozen at x1 by
# Fable 2026-10-02 (life histories stay fast; Wrysk): lifespan, growth, surplus floor,
# gestation and incubation; walking stays tied to upkeep (no motor gene). ---

[[gene]]
name = "upkeep"
path = "fauna.founders.*.core.maintenance_per_s"
tie = "each"
range = [0.25, 4.0]
what = "basal upkeep, x1 at the minimal gut's daily need f / 7,200 s (moves motor by the tie)"

[[gene]]
name = "yield"
path = "fauna.founders.*.yield_by_food.*"
tie = "each"
range = [0.25, 1.5]
what = "assimilation yield, every food (base yields <= 0.6, so <= 0.9)"

[[gene]]
name = "reserve"
path = "fauna.founders.*.core.reserve_cap"
tie = "each"
range = [0.5, 5.0]
what = "reserve per body (0.5 -> 0.25-2.5; 1.0 -> 0.5-5)"

[[gene]]
name = "sleep"
path = "fauna.founders.*.sleep_upkeep"
tie = "each"
range = [0.4, 2.0]
what = "upkeep asleep (0.5 -> 0.2-1.0; 0.3 -> 0.12-0.6); proposal: 0.5 endotherm-like, 0.3 ectotherm-like"

[[gene]]
name = "wake_hunger"
path = "fauna.founders.*.wake_hunger"
tie = "each"
mode = "value"
value = 0.9
range = [0.3, 0.95]
what = "hunger that wakes a sleeper (set, not scaled); the night default 0.9"

# --- The minimal gut (repair 2 item 11): per lineage the stomach k, the bite b, the
# appetite floor s0, the refill gap (repair 3) and the digestion time tau of each food
# class it eats. ---

[[gene]]
name = "stomach"
path = "fauna.founders.*.gut.stomach_k"
tie = "each"
range = [0.25, 4.0]
what = "k: stomach capacity per unit current body (0.012-0.20 -> 0.003-0.8)"

[[gene]]
name = "bite"
path = "fauna.founders.*.gut.bite_per_body_s"
tie = "each"
range = [0.25, 4.0]
what = "b: raw food a bite takes per unit body per second (default 2k / tau); its own gene, not tied to upkeep"

[[gene]]
name = "s0"
path = "fauna.founders.*.gut.s0"
tie = "each"
range = [0.25, 4.0]
what = "s0: a fed body wants food at S <= s0 K (0.15 -> 0.0375-0.6)"

[[gene]]
name = "refill_gap"
path = "fauna.founders.*.gut.refill_gap"
tie = "each"
range = [0.25, 4.0]
what = "appetite is capped at full_tolerance - refill_gap (repair 3; 0.1 -> 0.025-0.4)"

[[gene]]
name = "tau_litter@littershredder"
path = "fauna.founders.littershredder.gut.digestion_s.litter"
range = [0.25, 4.0]
what = "tau: the litter pool empties at S / tau into the reserve's room"

[[gene]]
name = "tau_carrion@littershredder"
path = "fauna.founders.littershredder.gut.digestion_s.carrion"
range = [0.25, 4.0]
what = "tau: the carrion pool empties at S / tau into the reserve's room"

[[gene]]
name = "tau_foliage@frondgrazer"
path = "fauna.founders.frondgrazer.gut.digestion_s.foliage"
range = [0.25, 4.0]
what = "tau: the foliage pool empties at S / tau into the reserve's room"

[[gene]]
name = "tau_carrion@lanternjaw"
path = "fauna.founders.lanternjaw.gut.digestion_s.carrion"
range = [0.25, 4.0]
what = "tau: the carrion pool empties at S / tau into the reserve's room"

[[gene]]
name = "tau_cap_tissue@capgnawer"
path = "fauna.founders.capgnawer.gut.digestion_s.cap_tissue"
range = [0.25, 4.0]
what = "tau: the cap_tissue pool empties at S / tau into the reserve's room"

[[gene]]
name = "tau_litter@capgnawer"
path = "fauna.founders.capgnawer.gut.digestion_s.litter"
range = [0.25, 4.0]
what = "tau: the litter pool empties at S / tau into the reserve's room"

[[gene]]
name = "tau_foliage@loftstrider"
path = "fauna.founders.loftstrider.gut.digestion_s.foliage"
range = [0.25, 4.0]
what = "tau: the foliage pool empties at S / tau into the reserve's room"

[[gene]]
name = "tau_film@ripple-snail"
path = "fauna.founders.ripple-snail.gut.digestion_s.film"
range = [0.25, 4.0]
what = "tau: the film pool empties at S / tau into the reserve's room"

[[gene]]
name = "tau_nectar@bellwing"
path = "fauna.founders.bellwing.gut.digestion_s.nectar"
range = [0.25, 4.0]
what = "tau: the nectar pool empties at S / tau into the reserve's room"

[[gene]]
name = "tau_carrion@seedporter"
path = "fauna.founders.seedporter.gut.digestion_s.carrion"
range = [0.25, 4.0]
what = "tau: the carrion pool empties at S / tau into the reserve's room"

[[gene]]
name = "tau_fruit@seedporter"
path = "fauna.founders.seedporter.gut.digestion_s.fruit"
range = [0.25, 4.0]
what = "tau: the fruit pool empties at S / tau into the reserve's room"

[[gene]]
name = "tau_carrion@chorister"
path = "fauna.founders.chorister.gut.digestion_s.carrion"
range = [0.25, 4.0]
what = "tau: the carrion pool empties at S / tau into the reserve's room"

[[gene]]
name = "pack_size@chorister"
path = "fauna.founders.chorister.pack.pack_size"
range = [0.5, 1.5]
what = "adults per founded pack (rounded): 2-6"

# --- Plants: the existing groups (turf, mat, shrub, tree), the grazing defence and
# decomposition, as cotrain.toml. ---

[[gene]]
name = "growth@turf"
path = "flora.@turf.foliage_rate"
range = [0.1, 4.0]
what = "foliage regrowth cap"

[[gene]]
name = "growth@mat"
path = "flora.@mat.foliage_rate"
range = [0.1, 4.0]
what = "foliage regrowth cap"

[[gene]]
name = "growth@shrub"
path = "flora.@shrub.foliage_rate"
range = [0.1, 4.0]
what = "foliage regrowth cap"

[[gene]]
name = "growth@tree"
path = "flora.@tree.foliage_rate"
range = [0.1, 4.0]
what = "foliage regrowth cap"

[[gene]]
name = "leaf_fall@turf"
path = "flora.@turf.senescence"
range = [0.05, 4.0]
what = "leaf fall rate"

[[gene]]
name = "leaf_fall@mat"
path = "flora.@mat.senescence"
range = [0.05, 4.0]
what = "leaf fall rate"

[[gene]]
name = "leaf_fall@shrub"
path = "flora.@shrub.senescence"
range = [0.05, 4.0]
what = "leaf fall rate"

[[gene]]
name = "leaf_fall@tree"
path = "flora.@tree.senescence"
range = [0.05, 4.0]
what = "leaf fall rate"

[[gene]]
name = "alpha@turf"
path = "flora.@turf.alpha"
range = [0.25, 2.0]
what = "foliage per unit wood"

[[gene]]
name = "alpha@mat"
path = "flora.@mat.alpha"
range = [0.25, 2.0]
what = "foliage per unit wood"

[[gene]]
name = "alpha@shrub"
path = "flora.@shrub.alpha"
range = [0.05, 2.0]
what = "foliage per unit wood"

[[gene]]
name = "alpha@tree"
path = "flora.@tree.alpha"
range = [0.005, 2.0]
what = "foliage per unit wood"

[[gene]]
name = "defence_onset"
path = "flora.@photo.defence_per_bite"
range = [0.25, 8.0]
what = "defence rise per bite"

[[gene]]
name = "defence_relax"
path = "flora.@photo.defence_half_life_s"
range = [0.03, 4.0]
what = "defence half-life"

[[gene]]
name = "decomposition"
path = "flora.decomposition"
range = [0.1, 4.0]
what = "litter decay (dead wood and carrion follow)"

# --- The lanternjaw's recruitment (Fable, 2026-10-02 readouts: riders grow 0.05-0.14
# body/h on frondgrazers toward a 0.25 drop-off line; small hosts cannot feed one).
# No host-size rule (with Wrysk). Since LANTERNJAW-LIFE (Wrysk 2026-10-10) the take is per
# rider body (parasite_take_body_per_day) and a host bears at most parasite_host_bear_per_day
# of its body, so a rider outgrows a small host. ---

[[gene]]
name = "rider_take"
path = "fauna.parasite_take_body_per_day"
range = [0.125, 2.0]
what = "a rider's take, its own body per ecological day, into its reserve (4 -> 0.5-8; LJ-GROW-B)"

[[gene]]
name = "rider_attach_radius"
path = "fauna.parasite_attach_radius_m"
range = [0.33, 2.67]
what = "host search radius from a hatching egg (0.75 m -> 0.25-2.0 m)"

[[gene]]
name = "rider_detach"
path = "fauna.parasite_detach_body_fraction"
range = [0.625, 2.0]
what = "the size a rider drops off at, x lanternjaw body_max (0.24 -> 0.15-0.48)"

# --- The plants' night budget (night, 2c7fd076). ---

[[gene]]
name = "night_bloom"
path = "flora.*.night_bloom_scale"
range = [0.1, 3.0]
what = "nectar and fruit made at night, x the day rate (0.3 -> 0.03-0.9)"
