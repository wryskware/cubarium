# The exhibited candidate (design/handoffs/roster-search-groundwork-2026-10-02.md §6):
# roster.toml with these genes moved, hand-picked to pass every analytic screen (R a readout;
# plants at x1; sleep and wake hunger the night defaults).
# Training only; the live defaults are unchanged. Generated; see the commit message.
# The minimal gut (2026-10-03): upkeep at x1 (the gut's daily need f), no `intake` gene
# (bite_per_s is gone), the rider's take as `rider_take`; the gut genes it leaves out
# start at x1.

[base]
file = "config/desktop/terrarium.toml"

[brains]
littershredder = "config/training/curiosity-2026-10-02/C1-centre-littershredder.json"
frondgrazer = "config/training/curiosity-2026-10-02/C1-centre-frondgrazer.json"

[screen]
r = [0.02, 0.3]
s = [0.02, 0.2]
f_min = 10.0
base = 200.0
k = 10.0
run_margin = 2.0
k_soft = 5.0
light_moisture = 0.67
harvest = 0.2
r_readout = true

[screen.night]
f0 = 0.8
margin = 1.2

[screen.food]
min_ratio = 1.0
vine_faces_founded = 1.0
balance_share = 0.5

[targets]
version = 3
birth_required = ["littershredder", "frondgrazer", "capgnawer", "loftstrider", "ripple-snail", "bellwing", "seedporter"]
birth_credit_max = 0.5
ready_target = 0.5
progress = ["lanternjaw", "chorister"]
lanternjaw_progress = 0.5
chorister_pup_survival = 0.5
replenish = ["littershredder", "frondgrazer", "capgnawer", "loftstrider", "ripple-snail", "bellwing", "seedporter", "chorister"]
replenish_weight = 5.0
lively_weight = 10.0
share_weight_unestablished = 0.2

[[gene]]
name = "upkeep@littershredder"
path = "fauna.founders.littershredder.core.maintenance_per_s"
range = [0.25, 4.0]
value = 1.0

