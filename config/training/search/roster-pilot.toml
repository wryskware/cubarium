# The full-roster PILOT (Astra's review 2026-10-02, design/7_Research/astra-roster-search-review-2026-10-02.md;
# launched by roster-pilot.sh). Generated from roster.toml and roster-exhibit.toml; an explicitly
# PARTIAL, pre-night-mechanics experiment, not a full-roster sustainability result.
#
# - x1 is the live terrarium ([base]); every gene starts at the exhibit's value (so the
#   generation's reference candidate is the exhibit, the incumbent).
# - F1: the bellwing, seedporter and chorister stay in the food web and the readouts but are
#   READOUT-ONLY: no stage, replenishment or loss penalty, their loss stops nothing, their
#   bodies are out of the population band (and the lanternjaw share's denominator), and
#   their genes each plus the pack size are FROZEN at the exhibit's values.
# - The minimal gut (2026-10-03, design/metabolism-meals-2026-10-02.md repair 2 item 11):
#   upkeep is x1 at the gut's daily need f / 7,200 s (the exhibit's old cuts are gone);
#   `intake` (on the unread bite_per_s) is replaced by the gut's own genes per lineage:
#   stomach k, bite b, appetite floor s0, refill gap (repair 3) and tau per food class
#   eaten; the rider's take is `rider_take` (parasite_take_per_day). Gut genes start at
#   x1. The lanternjaw's and loftstrider's genes are frozen too: readout-only lineages give
#   the search no signal (Fable 2026-10-03). 60 searched.
# - F7: R is a readout; S and F are soft (run_margin 1e6: every miss runs and pays k_soft x
#   its log-distance); the night envelope stays hard (a design envelope, not impossibility).
# - F3: food access is soft; only a lineage with no supply path at all is refused.
# - F2: the lanternjaw is graded above its 2-h pass line (a live rider).
# - Night (2c7fd076) is in the base defaults; night_bloom_scale stays at its 0.3 default
#   (the night_bloom gene frozen at x1).

[base]
file = "config/desktop/terrarium.toml"

[brains]
littershredder = "config/training/curiosity-2026-10-02/C1-centre-littershredder.json"
frondgrazer = "config/training/curiosity-2026-10-02/C1-centre-frondgrazer.json"

[screen]
r = [0.02, 0.3]
s = [0.02, 0.2]
f_min = 10.0
base = 200.0
k = 10.0
run_margin = 1000000.0
k_soft = 5.0
light_moisture = 0.67
harvest = 0.2
r_readout = true

[screen.night]
f0 = 0.8
margin = 1.2

[screen.food]
min_ratio = 1.0
vine_faces_founded = 1.0
balance_share = 0.5

[targets]
version = 3
birth_required = ["littershredder", "frondgrazer", "capgnawer", "loftstrider", "ripple-snail", "bellwing", "seedporter"]
birth_credit_max = 0.5
ready_target = 0.5
progress = ["lanternjaw", "chorister"]
lanternjaw_progress = 0.5
chorister_pup_survival = 0.5
replenish = ["littershredder", "frondgrazer", "capgnawer", "loftstrider", "ripple-snail", "bellwing", "seedporter", "chorister"]
replenish_weight = 5.0
lively_weight = 10.0
share_weight_unestablished = 0.2
# Continuous balance (the search rebase's addendum, Wrysk 2026-10-03): with the gut a full
# adult lasts 3-25 world days, so alive counts after 2 h no longer show starvation.
# - Each lineage in `balance` pays balance_weight x its soft shortfall on B >= 1 and
#   R-hat >= 1 (live/balance.rs); persistence stays hard.
# - counts_readout: the population band, its peak and the lanternjaw share are readouts.
# - The chorister, lanternjaw and loftstrider are readout-only: a founders-only world has
#   not established their food (too few prey; no vaulttree groves). Staged arrival is a
#   separate proposal.
# The pilot keeps its feeders readout-only too (F1).
readout_only = ["bellwing", "seedporter", "chorister", "lanternjaw", "loftstrider"]
balance = ["littershredder", "frondgrazer", "capgnawer", "ripple-snail"]
balance_weight = 5.0
counts_readout = true

