# Cubarium on the Tachyon: voxel presentation and world configuration.
#
# Installed to /var/lib/cubarium/voxel.toml by scripts/tachyon-install.sh.
# 160 voxels wide * 4 px/voxel = 640 px raster width; 360 px raster height rotated
# 90 degrees with 3x nearest-neighbour upscale fills the 1080x1920 panel exactly.
#
# The world is the designed **terrarium** (Wrysk, 2026-09-23): 160 x 72 x 24 at
# 0.125 m, a ring 20 m round, 9 m tall, 3 m deep. `natural.toml` beside this is the
# natural `small` ring; to run that instead, copy it over this file before deploying.

tilt_degrees = 30.0
px_per_voxel = 4
raster_height = 360
haze = 0.55
water_alpha = 0.5
dither = 0.04
sky_gradient = true

[world]
width = 160
height = 72
depth = 24
voxel_m = 0.125
water_substeps = 4

[world.landform]
preset = "terrarium-small"
# The preset's fields can be overridden under it one by one, nested tables included:
# water_level_m = 0.375        # where the lake and water table stand, above the yard
#
# [world.landform.water]
# reentry_m3_per_s = 2.0e-3    # the stream at the spring
