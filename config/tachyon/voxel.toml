# SHREDDER-NEST (Wrysk 2026-10-10, option A: "a shredder that finds its spot crowded goes
# somewhere quieter to lay, the way insects spread out their egg sites"): refused by the
# nest brake, it walks to the nearest uncrowded litter face within 3 m (three nest radii,
# room to clear a huddle and its rim) and lays there; a walk not ended by a clutch within
# a minute (the retry's length, ~5x a straight 3 m walk at cruise) is given up. Untuned.
core.reproduction.nest_seek = true
core.reproduction.nest_seek_m = 3.0
core.reproduction.nest_seek_give_up_s = 60.0
# Generation time (D1b, 2026-10-05): the gut's throughput scales with body as small
# animals' does (intake at a full stomach ~ body^0.75, Kleiber: a hatchling digests faster
# per unit of itself), and a mature body earmarks 0.8 of its net income for its next full
# clutch (the brood) and grows on the rest, so it lays at laying size instead of first
# growing to body_max. Plausible, untuned.
