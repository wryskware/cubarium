core.body_max = 1.2768
gut.bite_per_body_s = 0.00011666666666666665
gut.digestion_s.litter = 342.8571428571429
gut.digestion_s.cap_tissue = 342.8571428571429
gut.digestion_s.carrion = 342.8571428571429
gut.digestion_s.foliage = 342.8571428571429
gut.digestion_s.film = 342.8571428571429
gut.digestion_s.nectar = 342.8571428571429
gut.digestion_s.fruit = 342.8571428571429
mass_scale = 60.0

