# Cubarium on the Tachyon: voxel presentation and world configuration (VR-2).
#
# Installed to /var/lib/cubarium/voxel.toml.
# 160 voxels wide * 4 px/voxel = 640 px raster width.
# 360 px raster height rotated 90 degrees with 3x nearest-neighbour upscale
# fills the 1080x1920 Waveshare panel exactly without letterbox or pillarbox.

tilt_degrees = 30.0
px_per_voxel = 4
raster_height = 360
haze = 0.55
water_alpha = 0.5
dither = 0.04
sky_gradient = true

[world]
width = 160
height = 48
depth = 24
voxel_m = 0.125
water_substeps = 4

# The shipped `small` landscape: benched headlands with grottos under their ledges, soil
# valleys between, and its own water inventory. The rain, evaporation and aquifer keys
# that used to sit here are the recipe's business now (`Recipe.water`); the panel does not
# state them.
[world.landform]
preset = "small"
