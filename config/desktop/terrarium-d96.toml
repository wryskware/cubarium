# F3: the seedporter, a diurnal fruit eater that climbs stems and vine faces and glides
# between groves, founded on the ground within its roost reach of fruit (lanternberry
# crowns, latticevine faces); the code default is 0, so training worlds are unchanged.
[fauna.founders.seedporter]
# SP-FLUSH: a short arm grab gives less visual warning than a whole-body lunge.
hunter.strike_warning_scale = 0.065
# SP-SHREDDER: small ground prey supplements fruit; the catch switch gates this table.
hunter.prey = [true, false, true, false, false, false, true, false, false]
# Fruit at the mouth is 1e-4..1e-3 ou: K is about a third of a ripe vine patch.
fruit_bite_half_stock = 0.0005
# Leave below ~2 upkeep rates (5% of the ~45-upkeep full gut rate).
give_up_fraction = 0.05
founding_count = 4
# The curiosity gate's ecology (the block at the end of this file).
core.growth_max_per_s = 0.0001107644291842069
core.reproduction.birth_interval_s = 1097.8253659193513
core.reproduction.gestation_s = 109.78253659193513
core.reproduction.surplus_hold_s = 548.9126829596756

# R3: the chorister, a diurnal pack hunter (frondgrazer, loftstrider, lanternjaw,
# grounded seedporter) living as packs with a covered den, one breeder, provisioned
# pups and a territory. The count is packs of pack_size (4) adults; the code default is
# 0, so training worlds are unchanged.
[fauna.founders.chorister]
# Role call 2 (B1): young leave once grown; pups still at the den do not count.
dispersal.enabled = true # Wrysk chose B1
dispersal.at = "independent" # judged when a pup reaches independence
dispersal.group_max = 4 # a pack of 4 adults plus up to 4 pups at the den
founding_count = 1
# The curiosity gate's ecology (the block at the end of this file).
core.growth_max_per_s = 0.00032136258730417914
core.reproduction.birth_interval_s = 1097.8253659193513
core.reproduction.gestation_s = 6000.0
# LIFE-HISTORY (Wrysk 2026-10-06): the Veilhound litters once a pack a year, conceived in a
# window just after the dry season (the year is the season cycle, phase 0 its start), a
# wolf's gestation (0.17 of the year) at 1.5x upkeep; only a breeder at 0.6 of its reserve
# cap conceives, its litter 1-4 by condition; pups stay fed at the den for 0.6 of a year.
core.reproduction.litters_per_year = 1
core.reproduction.breeding_phase = 0.2
core.reproduction.breeding_window = 0.15
core.reproduction.gestation_upkeep_factor = 1.5
pack.breed_reserve_fraction = 0.6
pack.litter_by_condition = true
pack.independence_age_s = 21600.0
core.reproduction.surplus_hold_s = 548.9126829596756

