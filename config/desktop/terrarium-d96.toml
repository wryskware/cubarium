core.reproduction.birth_interval_s = 7200.0
# LANTERNJAW-LIFE: the floor is two days of a new adult's need (0.06; adult now at 0.35 of
# body_max, whose reserve cap 0.22 never cleared the old 0.15 floor plus an egg). The
# detritus web D2 had 0.15, two days of a full-grown one. See
# `Reproduction::DORMANT_EGGS_PLACEHOLDER`.
core.reproduction.surplus_floor = 0.06
core.reproduction.surplus_hold_s = 548.9126829596756
# LJ-GROW (d): three quarters of a grown body's net income saved for its next clutch
# (the shared 0.5), so a new adult lays sooner.
core.reproduction.brood_share = 0.75
# LJ-GROW: a predatory insect's conversion, about 0.6 (assimilation ~0.85 less the
# construction overhead; was the searched 0.469).
yield_by_food.litter = 0.6
yield_by_food.cap_tissue = 0.6
yield_by_food.carrion = 0.6
yield_by_food.foliage = 0.6
yield_by_food.film = 0.6
yield_by_food.nectar = 0.6
yield_by_food.fruit = 0.6

