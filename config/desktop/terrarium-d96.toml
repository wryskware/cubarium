# Cubarium on a desktop: the designed terrarium (a ring of tree and tower).
#
# `cubarium voxel --config config/desktop/terrarium.toml`
# (or `./scripts/run-voxel.sh --config config/desktop/terrarium.toml`)

tilt_degrees = 30.0
px_per_voxel = "auto"   # the largest that fits the screen, the whole strip in view
raster_height = 0
haze = 0.55
water_alpha = 0.5
dither = 0.04
sky_gradient = true
water_every = 1         # the display runs the live water; training, search and studies take 20
lighting = "lit"        # the desktop's tier; the panel and the cube keep the flat default
vine_tiles = true       # the latticevine as its tile layer, every other face a plain voxel (Wrysk, 2026-10-02)

[world]
width = 256
height = 128
depth = 96
voxel_m = 0.125

[world.landform]
preset = "terrarium"

# The day clock (`design/handoffs/voxel-weather-2026-09-24.md`, Wrysk's decision 1).
[world.day]
mode = "cycle"      # "cycle" | "local" | "off"
length_min = 120    # cycle: one day and night, minutes of simulated time
daylight = 0.67     # cycle: the share of it the sun is up
start_hour = 8.0    # cycle: where a fresh world starts, on a 24-hour clock of its day
# local: the wall clock, with today's sunrise and sunset at this place
# (06:00 and 18:00 on the local clock when these are absent)
# latitude = 47.6
# longitude = -122.3
# off: no night in the simulation (plants always lit, animals never sleep)
# look = "day"      # off only: "day" or "night", the picture alone
# plant_night_factor = 0.05  # plant upkeep and leaf loss in the dark, a fraction of the day rate (1 = none)

# The climate: temperature and wetness, and so when and how it rains. Any key of the
# preset can be overridden here one by one (crates/cubarium-voxel/src/weather.rs).
[world.climate]
preset = "tropical_jungle"
# weather_speed = "auto"  # (24 h / day)^0.65: 5x nature on a 2 h day; or a number
# dry_gap_min_s = 300   # the shortest wait after a rain event before a natural one;
# dry_gap_max_s = 900   # 0 / 0 turns the gap off
# The dry season (DRY-SEASON, Wrysk 2026-10-06: "lets add the dry season. or at least make
# it an option"; design/webmodel/meadow.md §11.6): every 5 world days, from day 5, a 1-day
# season in which natural rain falls at dry_season_rain of its hazards, so drained ground
# dries to about half its root water, the turf cures brown and woody seedlings starve
# back. The forced downpour at rh_max waits for the season to end. `dry_season = false`
# turns it off.
# Wrysk 2026-10-06: off by default everywhere else; kept on here, his desktop display, to watch it.
# Checks on this preset that don't study the season pass --set world.climate.dry_season_len_days=0
# (the year clock keeps running).
dry_season = true
dry_season_every_days = 5.0   # world days (the day clock's, as the plants count)
dry_season_len_days = 1.0
dry_season_phase_days = 5.0
dry_season_rain = 0.05           # the natural hazards' multiplier in the season (dry-hills fixture: about half the root water)
# [world.climate.downpour]
# rate_r0 = 1.5         # a mode's key, e.g. the rate it rains at in multiples of R0

# Roster R1 (design/handoffs/voxel-roster-2026-10-01.md): the capgnawer (glowcap caps)
# and the loftstrider (tall browser) are founded in the live presets; their code default
# is 0, so training worlds are unchanged.
[fauna.founders.capgnawer]
founding_count = 6
# The curiosity gate's ecology (the block at the end of this file).
core.growth_max_per_s = 0.0002847088887750853
core.reproduction.birth_interval_s = 1097.8253659193513
core.reproduction.incubation_s = 182.97089431989187
core.reproduction.surplus_hold_s = 548.9126829596756
# The detritus web D1 (design/lanternjaw-detritus-web-proposal-2026-10-05.md §3.1 with
# Astra's corrections): dark-active (awake where its own face is dark), breeding at 0.4 of
# the adult with 0.12-adult hatchlings (egg 1.2 hatchlings, floor a quarter egg), the
# clutch sized at laying from the surplus (eligible on one affordable egg), and the
# nest-site brake shipped with it. Plausible, untuned.
active = "Leaning"   # RHYTHMS-CADENCE (2026-10-09): its leaning, shade read as night (was "DarkActive")
core.birth_body = 0.25536
core.body_min = 0.076608
core.reproduction.egg_organic = 0.0919296
core.reproduction.surplus_floor = 0.0229824
core.reproduction.clutch_max = 3
core.reproduction.nest_radius_m = 1.0
core.reproduction.nest_crowd_max = 8
# Generation time (D1b, 2026-10-05): the gut's throughput scales with body as small
# animals' does (intake at a full stomach ~ body^0.75, Kleiber: a hatchling digests faster
# per unit of itself), and a mature body earmarks 0.8 of its net income for its next full
# clutch (the brood) and grows on the rest, so it lays at laying size instead of first
# growing to body_max. Plausible, untuned.
gut.mass_exponent = 0.75
core.reproduction.brood_share = 0.8
# The capgnawer package (2026-10-05, proposal §3.1E): numbers that follow the fungus.
# Eggs go within half a metre of a glowcap holding caps; a ready layer waits up to a
# quarter of a world day for a reserve that pays for its full clutch, then lays what it
# can. Plausible, untuned.
egg_site = "fungus"
core.reproduction.egg_fungus_radius_m = 0.5
core.reproduction.clutch_hold_max_s = 1800.0
# Role call 5A (Wrysk 2026-10-10, ROLES5): caps are its real food. Litter yields it a
# twentieth of a cap (0.025 against the caps' 0.5, was 0.25), so it lives at the glowcaps,
# lays there, and its numbers follow theirs; it weighs its foods by yield
# (`taste_by_yield`), so ordinary litter tastes under its feed gate and the fungal scent
# leads it on.
yield_by_food.litter = 0.025
taste_by_yield = true

[fauna.founders.loftstrider]
founding_count = 2
# The curiosity gate's ecology (the block at the end of this file).
core.growth_max_per_s = 0.0016448517733854723
core.reproduction.birth_interval_s = 1097.8253659193513
# 0.4 of the 10 sim-hour year: longer single-calf gestation.
core.reproduction.gestation_s = 14400.0
core.reproduction.litters_per_year = 1 # one conception per adult per year
core.reproduction.breeding_phase = 0.8 # +0.4 gestation births at 0.2, after the dry season
core.reproduction.breeding_window = 0.15 # births span 0.2–0.35 of the wetter growing season
# Role call 1 (B): a calf reaching adult size leaves when the herd's adults plus itself exceed group_max.
dispersal.enabled = true
dispersal.group_max = 3 # 3 adults plus that year's calves: a herd of 3–6
dispersal.at = "adult"
core.reproduction.surplus_hold_s = 548.9126829596756

# Roster R2b: glassfilm is seeded at founding and the ripple-snail (a water-bound film
