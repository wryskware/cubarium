# Cubarium on a desktop: the designed terrarium (a ring of tree and tower).
#
# `cubarium voxel --config config/desktop/terrarium.toml`
# (or `./scripts/run-voxel.sh --config config/desktop/terrarium.toml`)

tilt_degrees = 30.0
px_per_voxel = "auto"   # the largest that fits the screen, the whole strip in view
raster_height = 0
haze = 0.55
water_alpha = 0.5
dither = 0.04
sky_gradient = true
lighting = "lit"        # the desktop's tier; the panel and the cube keep the flat default
vine_tiles = true       # the latticevine as its tile layer, every other face a plain voxel (Wrysk, 2026-10-02)

[world]
width = 256
height = 128
depth = 48
voxel_m = 0.125

[world.landform]
preset = "terrarium"

# The day clock (`design/handoffs/voxel-weather-2026-09-24.md`, Wrysk's decision 1).
[world.day]
mode = "cycle"      # "cycle" | "local" | "off"
length_min = 120    # cycle: one day and night, minutes of simulated time
daylight = 0.67     # cycle: the share of it the sun is up
start_hour = 8.0    # cycle: where a fresh world starts, on a 24-hour clock of its day
# local: the wall clock, with today's sunrise and sunset at this place
# (06:00 and 18:00 on the local clock when these are absent)
# latitude = 47.6
# longitude = -122.3
# off: no night in the simulation (plants always lit, animals never sleep)
# look = "day"      # off only: "day" or "night", the picture alone
# plant_night_factor = 0.05  # plant upkeep and leaf loss in the dark, a fraction of the day rate (1 = none)

# The climate: temperature and wetness, and so when and how it rains. Any key of the
# preset can be overridden here one by one (crates/cubarium-voxel/src/weather.rs).
[world.climate]
preset = "tropical_jungle"
# weather_speed = "auto"  # (24 h / day)^0.65: 5x nature on a 2 h day; or a number
# dry_gap_min_s = 300   # the shortest wait after a rain event before a natural one;
# dry_gap_max_s = 900   # 0 / 0 turns the gap off
# [world.climate.downpour]
# rate_r0 = 1.5         # a mode's key, e.g. the rate it rains at in multiples of R0

# Roster R1 (design/handoffs/voxel-roster-2026-10-01.md): the capgnawer (glowcap caps)
# and the loftstrider (tall browser) are founded in the live presets; their code default
# is 0, so training worlds are unchanged.
[fauna.founders.capgnawer]
founding_count = 6

[fauna.founders.loftstrider]
founding_count = 2

# Roster R2b: glassfilm is seeded at founding and the ripple-snail (a water-bound film
# grazer) is founded on it; both code defaults are off, so training worlds are unchanged.
[flora]
seed_film_at_founding = true

[fauna.founders."ripple-snail"]
founding_count = 8

# F1: the bellwing, a diurnal nectar flyer, founded perched within its fan's reach of
# nectar (bloomcrown flowers, latticevine faces); the code default is 0, so training
# worlds are unchanged.
[fauna.founders.bellwing]
founding_count = 6

# F3: the seedporter, a diurnal fruit eater that climbs stems and vine faces and glides
# between groves, founded on the ground within its roost reach of fruit (lanternberry
# crowns, latticevine faces); the code default is 0, so training worlds are unchanged.
[fauna.founders.seedporter]
founding_count = 4

# R3: the chorister, a diurnal pack hunter (frondgrazer, loftstrider, lanternjaw,
# grounded seedporter) living as packs with a covered den, one breeder, provisioned
# pups and a territory. The count is packs of pack_size (4) adults; the code default is
# 0, so training worlds are unchanged.
[fauna.founders.chorister]
founding_count = 1
