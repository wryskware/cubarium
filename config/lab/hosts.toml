# labd host inventory (design/lab-daemon.md). Read at daemon start; restart labd to apply.
#
# Capacity per host: usable threads = min(floor(cpus * max_cpu_fraction), cpus - reserve_cpus);
# each L3 group gets its share. Builds may share the configured build thread overcommit and
# quick tasks their own, separate quick overcommit; memory limits always apply across all jobs.

[lab]
tick_s = 2            # daemon loop period
progress_s = 60       # kind progress cadence and liveness checks
probe_s = 300         # remote host probes (reachability, load, L3 groups, linger)
remote_poll_s = 30    # remote task polls
quick_timeout_min = 15 # quick tasks (quick = true, `lab quick`) are killed past this; a larger timeout_h is capped
# Transfers run in worker threads, never on the daemon loop (design/lab-daemon.md, Execution).
upload_floor_mb_s = 0.5     # an upload may take upload_base_s + its bytes at this floor rate. Note:
                            # Wrysk's upload is under ~2.2 MB/s (2026-10-12); a fixed 600 s cut every
                            # 0.8-1.9 GB checkpoint resume and spent its retry. Lower it for a worse line.
upload_base_s = 60          # fixed allowance per upload (ssh setup, small files)
transport_backoff_s = 30    # a host whose staging failed waits this long, doubling per failure in a row
transport_backoff_max_s = 900 # the longest such wait
fetch_workers = 3           # output mirrors (rsync home) in flight at once, all hosts together
# kind_paths = ["~/lab-kinds"]   # extra kind plugin dirs (also $LAB_KIND_PATH)

[build]
threads = 8           # cargo -j and the thread charge for build / cargo-test tasks (Wrysk 2026-10-10: not -j 32; rust-lld hammers IO)
mem_gb = 12           # memory charge for build / cargo-test tasks: measured peak + ~25 % (the
                      # workspace + GPU suites at -j 8 peaked at 9.8 GB, 2026-10-12; was 16).
                      # Every task's peak is in labd's events (mem_peak_gb); follow those.
keep_trees = 3        # snapshot trees kept (newest first) under ~/.cache/labd/trees as seeds
# Seed candidates for target/<profile>, relative to the built tree and to this checkout.
# The newest existing one is reflinked (cp -a --reflink=always); failure means a cold build.
seed_targets = ["target"]

[hosts.desktop]
# 9950X3D, 16 cores / 32 threads, two L3 groups (scripts/run-study.py --list, 2026-10-10):
#   group 0: CPUs 0-7,16-23 (V-cache CCD), group 1: CPUs 8-15,24-31.
# The live sysfs topology is used at start; this list documents it.
kind = "local"
arch = "x86_64"
cpus = 32
groups = "live"
# The live world and games prefer the V-cache group: fill group 1 first.
prefer_groups = [1, 0]
mem_gb = 91
max_mem_gb = 64       # Wrysk's ceiling for offline work (WORKING_POLICY.md); also each unit's MemoryMax
max_cpu_fraction = 0.9
reserve_cpus = 4      # Wrysk's app / desktop
build_overcommit_threads = 8 # shared extra threads for build / cargo-test only
quick_overcommit_threads = 8 # separate extra threads for quick tasks only (Wrysk 2026-10-11)
reserve_mem_gb = 2    # live MemAvailable must keep this free after a placement (Wrysk 2026-10-12: 12 → 2)
idle = true           # SCHED_IDLE + nice 19 for every task (= chrt -i 0 nice -n 19)
external_load = true  # subtract load labd does not own (loadavg - labd's threads)
launcher = "systemd"  # each task: systemd-run --user --collect transient unit
speed = 1.0

[hosts.eidolon]
# 24 threads, 62 GB. Probed 2026-10-10: L3 groups 0-5,12-17 and 6-11,18-23; Python 3.14;
# systemd-run --user works but Linger=no, so user units would die with the last session:
# launcher "auto" falls back to setsid + pid files until linger is enabled there.
kind = "ssh"
address = "eidolon.local"   # login shell is fish: labd always sends `bash -s` scripts
arch = "x86_64"
cpus = 24
groups = "auto"             # probed from eidolon's own sysfs, never desktop numbers
mem_gb = 62
max_mem_gb = 48
max_cpu_fraction = 0.9
reserve_cpus = 2
idle = true
external_load = true        # other eidolon jobs are respected via its loadavg
launcher = "auto"
root = "~/cubarium-train/lab"   # labd writes only here
python = "python3"
speed = 1.0
enabled = true

[ec2]
# docs/graviton-training.md. A launch needs `lab approve ec2 ID --max-hours H --max-usd D`
# every time; labd calls `down` when the queue drains or a limit is hit.
script = "scripts/aws-graviton.sh"
# Candidate sizes, smallest first; each has a same-size c6g fallback below.
# Choose the shortest ETA within 10% of the cheapest estimated total cost.
types = ["c7g.4xlarge", "c7g.8xlarge", "c7g.12xlarge", "c7g.16xlarge"]
cost_tolerance = 0.10
suggest_after_h = 4   # offer EC2 when the local queue estimate exceeds this many hours
setup_h = 0.25        # boot + bootstrap + transfer allowance in the estimate
tail_fraction = 0.25  # move a tail at or below this share of charged usable threads, with no eligible pending task
tail_min_remaining_h = 0.5 # minimum remaining EC2 wall hours, after charging checkpoint replay against the move
tail_hold_min = 10    # low-fill condition must persist for these wall minutes before moving tasks
tail_check_s = 120    # after the hold, re-check (and rsync EC2 outputs) at most this often
reserve_mem_gb = 4    # usable memory = the type's memory less this (no 64 GB desktop ceiling)
# Dedicated instance: labd's work here is ssh polls and tiny wrappers.
# 2026-10-11: 16 voxel_census tasks x 2 threads averaged load 29.6 on 64 vCPU;
# each used ~1.8 cores / 1.1 GB RSS. Let 32 charged threads fill a 32-vCPU size.
max_cpu_fraction = 1.0
reserve_cpus = 0
user = "ec2-user"
ssh_key = "~/.ssh/cubarium-aws.pem"
root = "/home/ec2-user/cubarium-train/lab"
python = "python3.11"
launcher = "setsid"
ready_file = "/var/tmp/ready"
status_s = 60
launch_timeout_s = 900
# Optional S3 (private bucket; lifecycle expires ckpt/ after 21 days, bin/ after 60, multipart after 1).
# Instances reach it only through the instance profile's role; labd never holds AWS credentials. At
# host-up labd checks on the instance that its aws cli can list the bucket (`ec2-s3` event); without
# the profile or access every S3 path stays off for that instance.
s3_bucket = "cubarium-lab-360d2fe4c5"
s3_region = "us-east-1"
instance_profile = "cubarium-lab-ec2"  # bucket-only role (Wrysk ran the setup 2026-10-13); `up` fails if it is deleted
s3_timeout_s = 900          # one in-region S3 copy (a ~145 MB checkpoint takes seconds)

# Spot prices are planning assumptions: the 2026-09-28 sample's $0.75/h
# scaled proportionally as 0.75 * cpus / 64, not live quotes.
[ec2.instance_types."c7g.4xlarge"]
arch = "aarch64"
cpus = 16
mem_gb = 32
spot_usd_h = 0.1875
speed = 1.0
fallback = "c6g.4xlarge"

[ec2.instance_types."c7g.8xlarge"]
arch = "aarch64"
cpus = 32
mem_gb = 64
spot_usd_h = 0.375
speed = 1.0
fallback = "c6g.8xlarge"

[ec2.instance_types."c7g.12xlarge"]
arch = "aarch64"
cpus = 48
mem_gb = 96
spot_usd_h = 0.5625
speed = 1.0
fallback = "c6g.12xlarge"

[ec2.instance_types."c7g.16xlarge"]
arch = "aarch64"
cpus = 64
mem_gb = 128
spot_usd_h = 0.75
speed = 1.0
fallback = "c6g.16xlarge"

# Fallbacks only, never candidates in the cost/ETA comparison.
[ec2.instance_types."c6g.4xlarge"]
arch = "aarch64"
cpus = 16
mem_gb = 32
spot_usd_h = 0.1875
speed = 0.9

[ec2.instance_types."c6g.8xlarge"]
arch = "aarch64"
cpus = 32
mem_gb = 64
spot_usd_h = 0.375
speed = 0.9

[ec2.instance_types."c6g.12xlarge"]
arch = "aarch64"
cpus = 48
mem_gb = 96
spot_usd_h = 0.5625
speed = 0.9

[ec2.instance_types."c6g.16xlarge"]
arch = "aarch64"
cpus = 64
mem_gb = 128
spot_usd_h = 0.75
speed = 0.9
